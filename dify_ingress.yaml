apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dify
spec:
  ingressClassName: nginx
  rules:
    - host: dify.k8s.orb.local
      http:
        paths:
          - backend:
              service:
                name: dify
                port:
                  number: 80
            path: /
            pathType: Prefix
